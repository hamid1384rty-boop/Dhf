name: Build signed APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$ZIP_FILE" || { echo "Project ZIP not found in repository root"; exit 1; }
          rm -rf /tmp/project-source
          mkdir -p /tmp/project-source
          unzip -q -o "$ZIP_FILE" -d /tmp/project-source
          TOP=$(find /tmp/project-source -mindepth 1 -maxdepth 1 | head -n 1)
          COUNT=$(find /tmp/project-source -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$COUNT" = "1" ] && [ -d "$TOP" ]; then
            cp -a "$TOP"/. .
          else
            cp -a /tmp/project-source/. .
          fi
          test -f settings.gradle.kts
          test -d app

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Install Gradle 9.3.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip -d "$HOME"
          echo "$HOME/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Restore signing key from GitHub Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          chmod 600 my-upload-key.jks
          keytool -list -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" -alias upload >/dev/null

      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          test -n "$STORE_PASSWORD" || { echo "STORE_PASSWORD secret is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD secret is missing"; exit 1; }
          gradle --no-daemon :app:assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: hamid-taneel-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
