name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found in repository root"
            exit 1
          fi
          rm -rf /tmp/project-source
          mkdir -p /tmp/project-source
          unzip -q -o "$ZIP_FILE" -d /tmp/project-source

          ROOT=$(find /tmp/project-source -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$ROOT" ] && [ "$(find /tmp/project-source -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ]; then
            cp -a "$ROOT"/. .
          else
            cp -a /tmp/project-source/. .
          fi

          test -f settings.gradle.kts
          test -d app
          echo "Project extracted successfully"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hamid-taneel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
